name: Vector Clock Lab CI
on:
  pull_request:
    paths:
      - 'backend/algorithms/vector_clock.py'
      - 'backend/routers/vector_clock.py'
      - 'backend/main.py'
      - 'tests/test_vector_clock.py'
      - 'frontend/**'
      - '.github/workflows/vector-clock-ci.yml'
  push:
    branches: [main, feature/vector-clock-lab]
jobs:
  vector-clock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests/test_vector_clock.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
