name: Beacon Monitoring Lab CI

on:
  pull_request:
    paths:
      - 'backend/algorithms/beacon_monitor.py'
      - 'backend/routers/beacon.py'
      - 'frontend/src/pages/BeaconMonitoringLab.jsx'
      - 'tests/test_beacon_monitor.py'
      - '.github/workflows/beacon-monitor-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/algorithms/beacon_monitor.py'
      - 'backend/routers/beacon.py'
      - 'frontend/src/pages/BeaconMonitoringLab.jsx'
      - 'tests/test_beacon_monitor.py'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q tests/test_beacon_monitor.py
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
