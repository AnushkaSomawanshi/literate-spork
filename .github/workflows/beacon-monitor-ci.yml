name: Beacon Monitoring Lab CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/test_beacon_monitor.py'
      - 'docs/BEACON_MONITORING_LAB.md'
      - '.github/workflows/beacon-monitor-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/test_beacon_monitor.py'
      - '.github/workflows/beacon-monitor-ci.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - name: Run beacon unit tests
        run: python -m pytest -q tests/test_beacon_monitor.py
        env:
          PYTHONPATH: .

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
