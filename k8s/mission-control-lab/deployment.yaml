apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-demo
  namespace: mission-control-lab
  labels:
    app.kubernetes.io/name: self-healing-demo
    app.kubernetes.io/managed-by: mission-control-kubernetes-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: self-healing-demo
      app.kubernetes.io/managed-by: mission-control-kubernetes-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: self-healing-demo
        app.kubernetes.io/managed-by: mission-control-kubernetes-lab
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
